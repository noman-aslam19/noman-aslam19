name: Profile-Graphics

on:
  schedule:
    - cron: "0 18 * * *"   # daily, 18:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-graphics
    steps:
      - uses: actions/checkout@v4

      # Snake that eats the contribution graph (Platane/snk)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            mono/snake-dark.svg?color_snake=#ffffff&color_dots=#161616,#3a3a3a,#6b6b6b,#a8a8a8,#f5f5f5
            mono/snake.svg?color_snake=#000000&color_dots=#ececec,#c4c4c4,#8e8e8e,#555555,#111111
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3D contribution calendar, styled by .github/profile-3d-settings.json
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update profile graphics" || echo "No changes to commit"
          git push
