name: Profile-Graphics

on:
  schedule:
    - cron: "0 18 * * *"   # daily, 18:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-graphics
    steps:
      - uses: actions/checkout@v4

      # Snake that eats the contribution graph (Platane/snk)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            cyber/snake-dark.svg?color_snake=#ff003c&color_dots=#1a1a1f,#4a4500,#8d8300,#cfc200,#fcee09
            cyber/snake.svg?color_snake=#d4002f&color_dots=#ececec,#e8df7a,#cfc200,#9c9100,#6b6300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3D contribution calendar, styled by .github/profile-3d-settings.json
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update profile graphics" || echo "No changes to commit"
          git push
