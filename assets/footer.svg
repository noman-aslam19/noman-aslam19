<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-labelledby="t d">
<title id="t">Footer</title><desc id="d">Animated heartbeat line with a thank you message.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="accH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <radialGradient id="gC" cx="0.08" cy="0.05" r="0.75"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="gV" cx="0.95" cy="0.98" r="0.75"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
  <filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 34 H330 l12 -20 l14 40 l14 -34 l9 14 H900" fill="none" stroke="url(#accH)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1300" stroke-dashoffset="0" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="1300;0;0" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
</path>
<text x="450" y="80" text-anchor="middle" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="13" letter-spacing="1" fill="#8b98b0">thanks for stopping by  ·  let's build something great</text>
</svg>
