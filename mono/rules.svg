<text x="56" y="100" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#4a4a4a">01</text><clipPath id="r0"><rect x="88" y="78" width="780" height="32"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.1000;0.2667;1" dur="6.0s" begin="0s" fill="freeze"/></rect></clipPath><g clip-path="url(#r0)"><text x="92" y="100" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="19" xml:space="preserve"><tspan fill="#b8b8b8">make it work. </tspan><tspan fill="#fafafa" font-weight="700">make it secure.</tspan><tspan fill="#b8b8b8"> then make it pretty.</tspan></text></g><text x="56" y="146" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#4a4a4a">02</text><clipPath id="r1"><rect x="88" y="124" width="780" height="32"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.3500;0.5167;1" dur="6.0s" begin="0s" fill="freeze"/></rect></clipPath><g clip-path="url(#r1)"><text x="92" y="146" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="19" xml:space="preserve"><tspan fill="#b8b8b8">if i can&#x27;t explain it, </tspan><tspan fill="#fafafa" font-weight="700">i don&#x27;t ship it.</tspan></text></g><text x="56" y="192" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#4a4a4a">03</text><clipPath id="r2"><rect x="88" y="170" width="780" height="32"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.6000;0.7667;1" dur="6.0s" begin="0s" fill="freeze"/></rect></clipPath><g clip-path="url(#r2)"><text x="92" y="192" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="19" xml:space="preserve"><tspan fill="#b8b8b8">readable code beats </tspan><tspan fill="#fafafa" font-weight="700">clever code</tspan><tspan fill="#b8b8b8">. every time.</tspan><tspan fill="#fafafa" dx="6">█<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5001;0.999;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text></g>
