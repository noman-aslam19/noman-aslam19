<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="t d">
<title id="t">End of transmission</title><desc id="d">Footer: glitching end of transmission text, thanks for stopping by, signed noman.</desc>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#ffffff" opacity="0.05"/></pattern>
  <pattern id="haz" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="22" fill="#fcee09"/><rect x="11" width="11" height="22" fill="#0b0b0d"/></pattern>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0.35"/></linearGradient>
  <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"><animate attributeName="seed" values="1;2;3;4;5;6" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect x="0" y="10" width="900" height="2" fill="#2b2b32"/>
<g font-family="Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif" font-size="40" letter-spacing="6" text-anchor="middle">
  <text x="450" y="70" fill="#ff003c" fill-opacity="0.8">END OF TRANSMISSION<animateTransform attributeName="transform" type="translate" values="3 0;3 0;9 -1;-5 1;3 0;3 0" keyTimes="0;0.5;0.52;0.55;0.58;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="450" y="70" fill="#00f0ff" fill-opacity="0.8">END OF TRANSMISSION<animateTransform attributeName="transform" type="translate" values="-3 0;-3 0;-9 1;5 -1;-3 0;-3 0" keyTimes="0;0.5;0.52;0.55;0.58;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="450" y="70" fill="#e8e8ea">END OF TRANSMISSION</text>
</g>
<text x="450" y="96" text-anchor="middle" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace" font-size="13" letter-spacing="3" fill="#8d8d98">// thanks for stopping by</text>
<g transform="rotate(-4 770 100)"><text x="716" y="104" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" fill="#00f0ff">— noman</text></g>
<rect x="0" y="130" width="900" height="12" fill="url(#haz)"/>

</svg>
